version: "3.8"
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bbs-network

  frontend:
    build: ./bbs-frontend
    environment:
      - NEXT_PUBLIC_API_KEY=d5Kf9ul2jH7sRmPqlahVYBzXeABDM13LKg2aTd4uFJ8NcOWqElU59x785AYBt
    networks:
      - bbs-network

  backend:
    build: ./bbs-backend
    environment:
      - API_KEY=d5Kf9ul2jH7sRmPqlahVYBzXeABDM13LKg2aTd4uFJ8NcOWqElU59x785AYBt
    networks:
      - bbs-network

  redis:
    image: redis:alpine
    networks:
      - bbs-network

networks:
  bbs-network:
    driver: bridge
