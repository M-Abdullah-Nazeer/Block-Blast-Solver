# Redirect HTTP (both www and non-www) to HTTPS non-www
server {
    listen 80;
    listen [::]:80;
    server_name blockblastsolverai.com www.blockblastsolverai.com;
    return 301 https://blockblastsolverai.com$request_uri;
}

# HTTPS server block for non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blockblastsolverai.com;

    # SSL certs from your mounted ./nginx/certs
    ssl_certificate     /etc/letsencrypt/live/blockblastsolverai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockblastsolverai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;


    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; img-src 'self' blob: data: https:;" always;

    # Redirect any www over HTTPS → non-www
    if ($host = www.blockblastsolverai.com) {
        return 301 https://blockblastsolverai.com$request_uri;
    }

    # Frontend (Next.js) — note "frontend" is the service name in Docker Compose
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # API (FastAPI)
    location /api/ {
        client_max_body_size 5M;

        
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
    }

}
